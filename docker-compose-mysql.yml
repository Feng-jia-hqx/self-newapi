# New-API Docker Compose — 外置 MySQL + Redis 多节点生产部署
#
# 适用场景：生产环境多节点横向扩展
# 前置条件：已部署外部 MySQL 和 Redis 实例
#
# 多节点部署步骤：
#   1. 部署外部 MySQL 和 Redis（不在此 compose 中管理）
#   2. 修改下方 SQL_DSN / REDIS_CONN_STRING 指向外部实例
#   3. 生成 SESSION_SECRET 和 CRYPTO_SECRET（所有节点必须一致）
#      openssl rand -hex 32
#   4. 一个节点作为 master（不设 NODE_TYPE 或留空）
#      其余节点设为 NODE_TYPE=slave
#   5. 各节点分别 docker-compose -f docker-compose-mysql.yml up -d
#   6. 前置 Nginx/HAProxy 负载均衡到各节点的 3000 端口
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # ===== 数据库 & 缓存（必填）=====
      - SQL_DSN=root:CHANGE_ME@tcp(10.19.30.154:3306)/new-api  # ⚠️ 修改为你的外部 MySQL 地址
      - REDIS_CONN_STRING=redis://:CHANGE_ME@10.19.30.143:6379  # ⚠️ 修改为你的外部 Redis 地址和密码
      - TZ=Asia/Shanghai

      # ===== 密钥（多节点必须一致）=====
      - SESSION_SECRET=CHANGE_ME_SESSION_SECRET  # ⚠️ 所有节点必须相同！用 openssl rand -hex 32 生成
      - CRYPTO_SECRET=CHANGE_ME_CRYPTO_SECRET    # ⚠️ 所有节点必须相同！用 openssl rand -hex 32 生成

      # ===== 运行模式 =====
      - GIN_MODE=release              # 生产模式，关闭 Debug 输出

      # ===== 节点角色 =====
      # Master 节点：不设 NODE_TYPE（负责 DB 迁移、后台任务、前端）
      # Slave 节点：设为 slave
      # - NODE_TYPE=slave
      # - FRONTEND_BASE_URL=http://master-node-ip:3000  # 非必须。Slave 前端页面重定向到 Master（API 请求不受影响）
      # - NODE_NAME=new-api-node-1  # 纯运维标识，无功能作用，仅便于区分各节点实例

      # ===== 数据库连接池 =====
      - SQL_MAX_IDLE_CONNS=100        # 空闲连接数（默认 100）
      - SQL_MAX_OPEN_CONNS=1000       # 最大连接数（默认 1000，注意 MySQL max_connections 上限）
      - SQL_MAX_LIFETIME=300          # 连接最大存活秒数（默认 60，生产建议 300）

      # ===== Redis =====
      - REDIS_POOL_SIZE=10            # Redis 连接池大小（默认 10）

      # ===== 功能开关 =====
      - ERROR_LOG_ENABLED=true        # 错误日志记录
      - BATCH_UPDATE_ENABLED=true     # 批量更新

      # ===== 可选配置 =====
      # - STREAMING_TIMEOUT=300       # 流模式超时秒数（默认 300）
      # - SYNC_FREQUENCY=60           # 缓存从 DB 同步间隔秒数（默认 60）
      # - RELAY_TIMEOUT=300           # 上游请求超时秒数（默认 0 不限制）
      # - MEMORY_CACHE_ENABLED=true   # 启用内存缓存（有 Redis 时自动启用）
      # - TRUSTED_REDIRECT_DOMAINS=your-domain.com  # 信任的重定向域名

    networks:
      - new-api-network

    # ===== 日志限制（防止撑满磁盘）=====
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ===== 资源限制 =====
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
        reservations:
          memory: 512m
          cpus: '0.5'

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  new-api-network:
    driver: bridge
